<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Theme before first paint, or a dark-mode visitor gets a white flash. Mirrors Theme.tsx. -->
    <script>
      try {
        var t = localStorage.getItem("relstate.theme");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      } catch (e) {
        /* private mode: fall back to prefers-color-scheme */
      }
    </script>
    <meta name="theme-color" content="#F4F6F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1714" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232B3A8F'/%3E%3Cpath d='M10 25V12.5L16 8l6 4.5V25' fill='none' stroke='%23F4F6F3' stroke-width='2.4' stroke-linejoin='round'/%3E%3Cpath d='M13.5 25v-6.5h5V25' fill='none' stroke='%23F4F6F3' stroke-width='2.4' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='13.6' r='1.6' fill='%23B88A2E'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Arriving for something · Relstate</title>
    <meta
      name="description"
      content="Semester starts, conferences and festivals in Kraków and Warsaw, each with a shortcut to apartments nearby. Sample data for the Relstate devnet demo."
    />
    <meta name="robots" content="noindex" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/events-main.tsx"></script>
  </body>
</html>
