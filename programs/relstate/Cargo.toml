[package]
name = "relstate"
version = "0.1.0"
description = "Created with Anchor"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "relstate"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
demo = []


[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.1.2", default-features = false, features = [
    "token",
    "token_2022",
] }
# pay_rent reads the instructions sysvar to find the confidential transfer carrying the rent;
# anchor-lang's solana_program shim only re-exports a slice of this crate.
solana-instructions-sysvar = "3.0.1"
# set_mint_allowed reads a confidential mint's auditor ElGamal key, whose OptionalNonZero wrapper
# lives here; the token-2022 interface does not re-export it. Version matches the one anchor-spl
# already pulls in, so this adds no new crate to the tree.
spl-pod = "0.7.4"
[dev-dependencies]
litesvm = "0.10.0"
litesvm-token = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
] }
