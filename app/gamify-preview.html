  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link

    <title>Relstate · gamification preview</title>

  <body>
    <!--
      A developer page, not a screen. It renders the reputation levels, badges, the level-up moment
      and the onboarding checklist against invented profiles, so each state can be seen without
      playing out months of leases on a chain. Open it on the dev server:

          npm run app   →   http://localhost:5173/gamify-preview.html

      It is deliberately not an entry in vite.config.ts, so it never ships in the app bundle.
      See app/src/gamify/preview.tsx.
    -->
    <div id="root"></div>
    <script type="module" src="/src/gamify/preview.tsx"></script>
  </body>
</html>
