<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Relstate · mediation preview</title>
  </head>
  <body>
    <!--
      A developer page, not a screen. It renders the real Mediation screen -- the rounds indicator,
      the status timeline, the candidate picker, the agree step, the fee line and the two exits --
      once per phase of a mediation, against invented leases and appraisers, so every state can be
      seen without a validator, a wallet or a registry:

          npm run app   →   http://localhost:5173/mediation-preview.html

      This is how the screen is reviewable before the D2 program is deployed. The live two-window
      run (docs/contracts/dispute-mediation.md, plan step S4) also needs the appraiser registry,
      which is the backend workstream's scripts/setup-appraisers.ts.

      It is deliberately not an entry in vite.config.ts, so it never ships in the app bundle.
      See app/src/screens/preview.tsx.
    -->
    <div id="root"></div>
    <script type="module" src="/src/screens/preview.tsx"></script>
  </body>
</html>
